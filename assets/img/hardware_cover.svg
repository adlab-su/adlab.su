<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ff5e1a" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
    <linearGradient id="grad-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="orange-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5e1a"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#grad-card)"/>
  <rect width="440" height="280" fill="url(#grid)"/>

  <!-- Outer Tech Border & Corner marks -->
  <rect x="12" y="12" width="416" height="256" fill="none" stroke="#232a35" stroke-width="1"/>
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#ff5e1a" stroke-width="2"/>
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#ff5e1a" stroke-width="2"/>
  <path d="M 12 256 L 12 268 L 24 268" fill="none" stroke="#ff5e1a" stroke-width="2"/>
  <path d="M 428 256 L 428 268 L 416 268" fill="none" stroke="#ff5e1a" stroke-width="2"/>

  <!-- PCB Circuit Traces -->
  <g stroke="#ff5e1a" stroke-opacity="0.4" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <path d="M 30 60 L 90 60 L 130 100 L 170 100"/>
    <path d="M 30 140 L 80 140 L 110 120 L 170 120"/>
    <path d="M 30 220 L 110 220 L 150 160 L 170 160"/>
    
    <path d="M 270 100 L 310 100 L 340 70 L 410 70"/>
    <path d="M 270 140 L 330 140 L 360 170 L 410 170"/>
    <path d="M 270 160 L 310 160 L 340 210 L 410 210"/>

    <path d="M 200 30 L 200 90"/>
    <path d="M 240 30 L 240 90"/>
    <path d="M 200 190 L 200 250"/>
    <path d="M 240 190 L 240 250"/>
  </g>

  <!-- PCB Contact Nodes / Pads -->
  <g fill="#ff5e1a">
    <circle cx="30" cy="60" r="3"/>
    <circle cx="30" cy="140" r="3"/>
    <circle cx="30" cy="220" r="3"/>
    <circle cx="410" cy="70" r="3"/>
    <circle cx="410" cy="170" r="3"/>
    <circle cx="410" cy="210" r="3"/>
    <circle cx="200" cy="30" r="3"/>
    <circle cx="240" cy="30" r="3"/>
    <circle cx="200" cy="250" r="3"/>
    <circle cx="240" cy="250" r="3"/>
  </g>

  <!-- Central Chip Package -->
  <rect x="170" y="90" width="100" height="100" rx="4" fill="#131822" stroke="#ff5e1a" stroke-width="2"/>
  <rect x="180" y="100" width="80" height="80" rx="2" fill="#0b0e14" stroke="#ffaa00" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Chip Text -->
  <text x="220" y="130" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">AD LAB</text>
  <text x="220" y="146" fill="#ff5e1a" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1.5">MCU-0002</text>
  <text x="220" y="162" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">ARM-IoT 2026</text>

  <!-- Chip Pin Indicators -->
  <g fill="#ffaa00">
    <!-- Top & Bottom Pins -->
    <rect x="185" y="85" width="4" height="5"/>
    <rect x="197" y="85" width="4" height="5"/>
    <rect x="209" y="85" width="4" height="5"/>
    <rect x="221" y="85" width="4" height="5"/>
    <rect x="233" y="85" width="4" height="5"/>
    <rect x="245" y="85" width="4" height="5"/>
    <rect x="257" y="85" width="4" height="5"/>

    <rect x="185" y="190" width="4" height="5"/>
    <rect x="197" y="190" width="4" height="5"/>
    <rect x="209" y="190" width="4" height="5"/>
    <rect x="221" y="190" width="4" height="5"/>
    <rect x="233" y="190" width="4" height="5"/>
    <rect x="245" y="190" width="4" height="5"/>
    <rect x="257" y="190" width="4" height="5"/>

    <!-- Left & Right Pins -->
    <rect x="165" y="105" width="5" height="4"/>
    <rect x="165" y="117" width="5" height="4"/>
    <rect x="165" y="129" width="5" height="4"/>
    <rect x="165" y="141" width="5" height="4"/>
    <rect x="165" y="153" width="5" height="4"/>
    <rect x="165" y="165" width="5" height="4"/>

    <rect x="270" y="105" width="5" height="4"/>
    <rect x="270" y="117" width="5" height="4"/>
    <rect x="270" y="129" width="5" height="4"/>
    <rect x="270" y="141" width="5" height="4"/>
    <rect x="270" y="153" width="5" height="4"/>
    <rect x="270" y="165" width="5" height="4"/>
  </g>

  <!-- Technical Annotations -->
  <text x="24" y="32" fill="#ff5e1a" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SCHEMATIC: PCB-REV.B</text>
  <text x="416" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">STATUS: R&amp;D PROTOTYPE</text>
  
  <text x="24" y="258" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8">TEST FREQ: 240MHz / 3.3V</text>
  <text x="416" y="258" fill="#ff5e1a" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="end">GOST-2026.HARD</text>
</svg>
